# HTTPS automático con Caddy (certificado de Let's Encrypt) en un servidor
# que no tiene otro proxy en los puertos 80 y 443.
# Lo activa: ./instalar.sh --dominio teatro.ejemplo.com
services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-datos:
  caddy-config:
