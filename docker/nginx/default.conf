server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Imágenes subidas desde el panel (siempre WebP recodificado, nombre aleatorio).
    location ~ "^/storage/obras/([A-Za-z0-9]{40}\.webp)$" {
        alias /var/www/html/storage/app/public/obras/$1;
        include /etc/nginx/cabeceras.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* ^/(css|js)/[a-z0-9._-]+\.(css|js)$ {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /favicon.svg { include /etc/nginx/cabeceras.conf; access_log off; try_files $uri =404; }
    location = /robots.txt { include /etc/nginx/cabeceras.conf; access_log off; try_files $uri =404; }
    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        try_files /nonexistent @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Nunca se reenvía la cabecera Proxy (vulnerabilidad "httpoxy").
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 70s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
