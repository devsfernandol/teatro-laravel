[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000
request_terminate_timeout = 65s

; Laravel lee la configuración de las variables de entorno del contenedor.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Funciones que la web nunca necesita: si alguien lograra ejecutar código,
; no podría lanzar comandos del sistema. (La consola, que sí las usa, no
; pasa por este pool.)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl
php_admin_flag[expose_php] = off
